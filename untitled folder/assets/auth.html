<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شمارة · تسجيل الدخول</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#193f33;font:14px Tahoma,Arial;min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:white;padding:34px;border:1px solid #e0e9e1;border-radius:18px;box-shadow:0 12px 50px #193f330b}small{font:11px Arial;letter-spacing:2px;color:#188064}h1{font-size:24px;margin:18px 0}p{line-height:1.9;color:#657c70;font-size:12px}label{display:block;margin:20px 0 8px}input{padding:13px;border:1px solid #cfded4;border-radius:8px;width:100%;font:inherit}button{padding:13px;background:#147d64;color:white;border:0;border-radius:8px;width:100%;font:inherit;margin-top:22px;cursor:pointer}button:disabled{opacity:.5}#error{color:#a33d31;min-height:20px}input:focus{outline:2px solid #86c7ad}</style><div class="box"><small>SHAMARA / TEAM WORKSPACE</small><h1 id="title">تسجيل الدخول</h1><p id="intro">ادخل بحسابك للوصول إلى مساحة العمل والأنظمة المخوّلة لك.</p><form id="authForm"><div id="nameWrap" hidden><label for="name">الاسم الكامل</label><input id="name" autocomplete="name"></div><label for="username">اسم المستخدم</label><input id="username" dir="ltr" required autocomplete="username" pattern="[A-Za-z0-9._-]{3,64}" maxlength="64"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password" maxlength="256"><p id="error" role="alert"></p><button id="submit">دخول</button></form><p>يحدّد مدير النظام صلاحيات طلبات الشراء والصادر والوارد لكل حساب.</p></div><script>
const config=__AUTH_CONFIG__;const $=s=>document.querySelector(s);if(config.setup){$('#title').textContent='إنشاء مدير النظام';$('#intro').textContent='إعداد مرة واحدة من الجهاز المركزي. اختر كلمة مرور لا تقل عن 12 حرفاً. لا توجد حسابات افتراضية.';$('#nameWrap').hidden=false;$('#name').required=true;$('#password').minLength=12;$('#password').autocomplete='new-password';$('#submit').textContent='إنشاء حساب المدير';if(!config.local){$('#authForm').hidden=true;$('#intro').textContent='يجب إنشاء أول مدير من الجهاز المركزي نفسه، ثم يستطيع الموظفون تسجيل الدخول من الشبكة.';}}
$('#authForm').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';$('#submit').disabled=true;try{const payload={name:$('#name').value,username:$('#username').value,password:$('#password').value};if(config.setup){const r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error((await r.json()).error);}const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error((await r.json()).error);location.reload();}catch(e){$('#error').textContent=e.message;}finally{$('#submit').disabled=false;}};
</script></html>
